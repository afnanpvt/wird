org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler computes relative paths between the pub
# cache (on C:) and this project's build dir (on D:) - File.relativeTo()
# throws IllegalArgumentException across drive letters on Windows, which
# crashes the Kotlin daemon and takes the whole Gradle daemon down with it
# (surfaced when just_audio's audio_session dependency, which ships Kotlin
# sources, was added - anything with Kotlin source on a plugin will hit
# this the same way). Disabling incremental compilation avoids that code
# path entirely; the compile is just slower, not broken.
kotlin.incremental=false
